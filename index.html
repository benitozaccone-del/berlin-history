<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Berlin History Walks</title>
<meta name="theme-color" content="#1c1b19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<meta name="apple-mobile-web-app-title" content="Berlin History">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Libre+Franklin:wght@400;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#fff;--band:#e0e0e0;--card:#fff;--ink:#363636;--mute:#6f6f6f;--line:#d6d6d6;--accent:#b3261e;--label:rgba(255,255,255,.88)}
@media (prefers-color-scheme:dark){:root{--bg:#161616;--band:#262626;--card:#1e1e1e;--ink:#ececec;--mute:#a3a3a3;--line:#3a3a3a;--accent:#ef6b5f;--label:rgba(22,22,22,.85)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Libre Franklin",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.brand,.tabs button{font-family:Jost,"Futura",system-ui,sans-serif}
header{position:sticky;top:0;z-index:500;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 0;box-shadow:0 1px 0 var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;height:40px}
.brand{font-size:21px;font-weight:400;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand b{font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.brand svg{width:22px;height:22px}
.locate{border:0;background:none;color:var(--ink);font:600 11px "Libre Franklin",sans-serif;display:flex;flex-direction:column;align-items:center;gap:1px;padding:0 2px}
.locate span{font-size:20px;line-height:1}
.locate.on{color:var(--accent)}
.tabs{display:flex;gap:22px;margin-top:4px}
.tabs button{border:0;background:none;color:var(--mute);padding:8px 0 9px;font-size:16px;font-weight:500;border-bottom:3px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.band{position:sticky;top:var(--hh,94px);z-index:499;background:var(--band);padding:10px 16px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:5px 12px;font:500 13px "Libre Franklin",sans-serif;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--bg)}
.hero{position:relative;margin:0 0 4px}
.hero img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--band)}
.labels{position:absolute;left:16px;right:16px;bottom:18px;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.labels>*{background:var(--label);color:var(--ink);padding:2px 8px;margin:0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.labels h1,.labels h2{font-size:30px;font-weight:500;line-height:1.15}
.labels p{font:400 17px Jost,sans-serif}
.credit-ov{position:absolute;right:6px;bottom:4px;font-size:9px;background:rgba(0,0,0,.55);color:#fff;padding:1px 5px}
main{padding:0 0 calc(110px + env(safe-area-inset-bottom))}
.intro{padding:20px 16px 8px;font-size:16px}
.intro a{color:var(--ink);font-weight:700}
.list{padding:8px 16px}
.card{display:block;width:100%;border:0;padding:0;margin:0 0 28px;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.card .ph{position:relative}
.card img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:var(--band)}
.card .labels{bottom:12px;left:12px;right:12px}
.card .labels h2{font-size:22px}
.card .labels .d{font:600 12px "Libre Franklin",sans-serif;background:var(--accent);color:#fff}
.card .txt{padding:10px 0 0;font-size:15px}
.card .txt p{margin:0 0 6px}
.more{font-weight:700;text-decoration:underline;text-underline-offset:3px}
.meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);align-items:center}
.meta span{display:inline-flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;display:inline-block}
.done .ph img{filter:grayscale(1) opacity(.7)}
.empty{color:var(--mute);text-align:center;padding:40px 0}
#map{position:fixed;left:0;right:0;bottom:0;z-index:1}
.sheet{position:fixed;inset:0;z-index:900;background:var(--bg);overflow-y:auto;transform:translateY(100%);transition:transform .25s ease}
.sheet.open{transform:none}
.close{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:12px;z-index:2;height:36px;padding:0 12px;border:0;background:var(--label);color:var(--ink);font:600 14px "Libre Franklin",sans-serif}
.crumb{background:var(--band);padding:10px 16px;font-size:14px;color:var(--mute)}
.body{padding:20px 16px calc(130px + env(safe-area-inset-bottom))}
.addr{font-size:14px;margin-bottom:6px}
.dist{color:var(--accent);font-weight:700}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0 22px}
.btn{text-align:center;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:12px;font:600 15px "Libre Franklin",sans-serif;text-decoration:none}
.btn.primary svg{vertical-align:-3px;margin-right:6px}
.player button svg{display:block;margin:auto}
.btn.primary{grid-column:1/-1;background:var(--accent);border-color:var(--accent);color:#fff;font-size:16px}
.lead{font-weight:700;font-size:17px;margin:0 0 14px}
.script p{font-size:17px;line-height:1.7;margin:0 0 14px}
.credit{font-size:11px;color:var(--mute);margin-top:24px;word-break:break-word}
.credit a{color:inherit}
.player{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:#363636;color:#fff;padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:none;align-items:center;gap:12px}
.player.show{display:flex}
.player button{border:0;background:var(--accent);color:#fff;width:44px;height:44px;font-size:17px;flex:none}
.player #skip{background:transparent;border:1px solid #fff;font:600 12px "Libre Franklin",sans-serif}
.player .t{flex:1;min-width:0}
.player .n{font:500 15px Jost,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player input{width:100%;accent-color:#ef6b5f;margin:2px 0}
.player .s{font-size:11px;opacity:.75}
.chap{display:flex;gap:14px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;padding:14px 0;cursor:pointer}
.chap img{width:96px;height:72px;object-fit:cover;flex:none;background:var(--band)}
.chap .no{font:500 12px Jost,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.chap h3{margin:1px 0 2px;font-size:19px;font-weight:500;line-height:1.2}
.chap .y{font-size:13px;color:var(--mute)}
.chap .pl{margin-left:auto;flex:none;width:40px;height:40px;background:var(--accent);color:#fff;display:grid;place-items:center}
.chap.playing h3{color:var(--accent)}
.sec{display:flex;align-items:baseline;justify-content:space-between;padding:22px 16px 0}
.sec h2{margin:0;font-size:24px;font-weight:500}
.lnk{border:0;background:none;color:var(--ink);font:700 14px "Libre Franklin",sans-serif;text-decoration:underline;text-underline-offset:3px;padding:0}
#homeStory{padding-top:0;padding-bottom:0}
#story{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.story-actions{padding:0 16px 8px}
/* larger screens: centred 720px column; header, band and player keep full-width backgrounds */
:root{--gut:max(16px, calc((100vw - 720px) / 2))}
header,.band{padding-left:var(--gut);padding-right:var(--gut)}
#main,#story,#detail{max-width:720px;margin:0 auto}
.player{padding-left:var(--gut);padding-right:var(--gut)}
@media (min-width:760px){.close{left:calc(var(--gut) + 12px)}.hero img{aspect-ratio:16/9}}
.leaflet-container{font-family:"Libre Franklin",sans-serif}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand"><svg viewBox="0 0 512 512" aria-hidden="true"><g fill="currentColor"><rect x="96" y="150" width="320" height="34"/><rect x="120" y="196" width="28" height="190"/><rect x="186" y="196" width="28" height="190"/><rect x="298" y="196" width="28" height="190"/><rect x="364" y="196" width="28" height="190"/><rect x="84" y="386" width="344" height="30"/><path d="M216 150l40-52 40 52z"/></g></svg><span>Berlin <b>History</b></span></div>
    <button id="locate" class="locate"><span>⌖</span>Near me</button>
  </div>
  <div class="tabs"><button id="tList" class="on">Places</button><button id="tMap">Map</button><button id="tStory">Story</button></div>
</header>
<div class="band"><div class="chips" id="chips"></div></div>
<main id="main">
  <div class="hero"><img src="img/brandenburg-gate.jpg" alt=""><div class="labels"><h1>Berlin 1914–1989</h1><p>A walking audioguide</p></div></div>
  <p class="intro">From the Kaiser's war to the fall of the Wall: <a href="#" id="introMap">32 places</a> where the twentieth century happened, each with a <strong>two-minute audio story</strong>.</p>
  <div class="sec"><h2>The story before you go</h2><button class="lnk" id="toStory">All chapters →</button></div>
  <div class="list" id="homeStory"></div>
  <div class="sec"><h2>Places</h2></div>
  <div class="list" id="list"></div>
</main>
<section id="story" hidden></section>
<div id="map" hidden></div>

<section class="sheet" id="sheet" aria-hidden="true">
  <button class="close" id="close">‹ Back</button>
  <div id="detail"></div>
</section>

<div class="player" id="player">
  <button id="pp" aria-label="Play/pause"></button>
  <div class="t">
    <div class="n" id="pn"></div>
    <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
    <div class="s" id="ps"></div>
  </div>
  <button id="skip" aria-label="Back 15 seconds" style="font-size:13px">−15</button>
</div>
<audio id="audio" preload="none"></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const PLAY = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></svg>';
const PAUSE = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6.5 4.5h4v15h-4zM13.5 4.5h4v15h-4z" fill="currentColor"/></svg>';
const setPP = playing => { $('#pp').innerHTML = playing ? PAUSE : PLAY; };

const store = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let DATA, CREDITS = {}, era = 'all', pos = null, map, markers = {}, current = null, useSpeech = false;
const visited = new Set(store.get('visited', []));

const km = (a, b) => { const R=6371, r=x=>x*Math.PI/180, dLa=r(b.lat-a.lat), dLo=r(b.lng-a.lng);
  return 2*R*Math.asin(Math.sqrt(Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2)); };
const fmtD = d => d < 1 ? Math.round(d*1000/10)*10 + ' m' : d.toFixed(1) + ' km';
const fmtT = s => isFinite(s) ? Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0') : '–';
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function init() {
  DATA = await (await fetch('data/places.json')).json();
  try { CREDITS = await (await fetch('data/credits.json')).json(); } catch {}
  const chips = [['all','All', '#888'], ...Object.entries(DATA.eras).map(([k,v]) => [k, v.label, v.color])];
  $('#chips').innerHTML = chips.map(([k,l,c]) => `<button class="chip${k==='all'?' on':''}" data-era="${k}">${k==='all'?'':`<i class="dot" style="background:${c}"></i>`}${l}</button>`).join('');
  $('#chips').onclick = e => { const b = e.target.closest('.chip'); if (!b) return;
    era = b.dataset.era; document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === b)); render(); };
  render();
  const id = location.hash.slice(1); if (id) open(id);
}

function filtered() {
  let ps = DATA.places.filter(p => era === 'all' || p.eras.includes(era));
  if (pos) ps = ps.map(p => ({...p, d: km(pos, p)})).sort((a,b) => a.d - b.d);
  return ps;
}

function render() {
  const ps = filtered();
  $('#list').innerHTML = ps.length ? ps.map(p => `
    <button class="card${visited.has(p.id)?' done':''}" data-id="${p.id}">
      <div class="ph"><img src="img/${p.id}.jpg" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
        <div class="labels"><h2>${visited.has(p.id)?'✓ ':''}${esc(p.name)}</h2>${p.d!=null?`<span class="d">${fmtD(p.d)}</span>`:''}</div></div>
      <div class="txt"><p>${esc(p.summary)} <span class="more">Listen →</span></p>
      <div class="meta">${p.eras.map(e=>`<span><i class="dot" style="background:${DATA.eras[e].color}"></i>${DATA.eras[e].label}</span>`).join('')}</div></div>
    </button>`).join('') : '<p class="empty">No places for this filter.</p>';
  if (map) drawMarkers();
}
$('#list').onclick = e => { const c = e.target.closest('.card'); if (c) open(c.dataset.id); };

// --- map ---
function showView(v) {
  ['tList','tMap','tStory'].forEach(t => $('#'+t).classList.toggle('on', t === {places:'tList',map:'tMap',story:'tStory'}[v]));
  $('#main').hidden = v !== 'places'; $('#map').hidden = v !== 'map'; $('#story').hidden = v !== 'story';
  $('.band').hidden = v === 'story';
  scrollTo(0, 0);
  if (v === 'story') renderStory();
  if (v === 'map') {
    $('#map').style.top = ($('header').offsetHeight + $('.band').offsetHeight) + 'px';
    if (!map) { map = L.map('map', {zoomControl:false}).setView([52.515, 13.39], 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(map); drawMarkers(); }
    setTimeout(() => map.invalidateSize(), 50);
  }
}
let meMarker;
function drawMarkers() {
  Object.values(markers).forEach(m => m.remove()); markers = {};
  filtered().forEach(p => {
    const c = DATA.eras[p.eras[p.eras.length-1]].color;
    markers[p.id] = L.circleMarker([p.lat,p.lng], {radius:9, color:'#fff', weight:2, fillColor:c, fillOpacity:visited.has(p.id)?.45:.95})
      .addTo(map).bindTooltip(p.name).on('click', () => open(p.id));
  });
  if (pos) { meMarker?.remove(); meMarker = L.circleMarker([pos.lat,pos.lng], {radius:7, color:'#fff', weight:3, fillColor:'#1a73e8', fillOpacity:1}).addTo(map); }
}
$('#tList').onclick = () => showView('places');
$('#tMap').onclick = () => showView('map');
$('#tStory').onclick = () => showView('story');
$('#introMap').onclick = e => { e.preventDefault(); showView('map'); };

// --- story: chapters played in sequence ---
let STORY;
const chapterItem = (c, i) => ({ id: c.id, name: `${i+1}. ${c.title}`, img: c.image, text: c.text, next: i + 1 });
const chapterRows = () => STORY.chapters.map((c,i) => `
      <button class="chap${current?.id===c.id?' playing':''}" data-i="${i}">
        <img src="img/${c.image}.jpg" alt="" loading="lazy">
        <div><div class="no">Chapter ${i+1}</div><h3>${esc(c.title)}</h3><div class="y">${c.years}</div></div>
        <span class="pl" data-play="${i}">${PLAY}</span>
      </button>`).join('');
async function renderHomeStory() {
  STORY = STORY || await (await fetch('data/story.json')).json();
  $('#homeStory').innerHTML = chapterRows();
}
async function renderStory() {
  STORY = STORY || await (await fetch('data/story.json')).json();
  const ch = STORY.chapters;
  $('#story').innerHTML = `
    <div class="hero"><img src="img/${ch[0].image}.jpg" alt=""><div class="labels"><h1>${esc(STORY.title)}</h1><p>${esc(STORY.subtitle)}</p></div></div>
    <p class="intro">Listen before you travel: <strong>${ch.length} chapters, about 25 minutes</strong>, from the Kaiser's empire to the fall of the Wall. They play one after another.</p>
    <div class="story-actions"><button class="btn primary" id="playAll" style="width:100%">${PLAY} Play the whole story</button></div>
    <div class="list">${chapterRows()}</div>`;
  $('#playAll').onclick = () => play(chapterItem(ch[0], 0));
}
$('#toStory').onclick = () => showView('story');
$('#story').onclick = $('#homeStory').onclick = e => {
  const pl = e.target.closest('[data-play]'), c = e.target.closest('.chap');
  if (pl) return play(chapterItem(STORY.chapters[pl.dataset.play], +pl.dataset.play));
  if (c) openChapter(+c.dataset.i);
};
function openChapter(i) {
  const c = STORY.chapters[i];
  $('#detail').innerHTML = `
    <div class="hero"><img src="img/${c.image}.jpg" alt=""><div class="labels"><h2>${esc(c.title)}</h2><p>Chapter ${i+1} · ${c.years}</p></div></div>
    <div class="crumb">Berlin History › Story › Chapter ${i+1}</div>
    <div class="body">
      <div class="actions"><button class="btn primary" id="play">${PLAY} Play chapter</button></div>
      <div class="script">${c.text.split('\n\n').map(p => `<p>${esc(p)}</p>`).join('')}</div>
    </div>`;
  $('#play').onclick = () => play(chapterItem(c, i));
  $('#sheet').scrollTop = 0; $('#sheet').classList.add('open'); $('#sheet').setAttribute('aria-hidden','false');
}

// --- geolocation ---
let watch;
$('#locate').onclick = () => {
  if (watch != null) { navigator.geolocation.clearWatch(watch); watch = null; pos = null; $('#locate').classList.remove('on'); render(); return; }
  if (!navigator.geolocation) return alert('Location not available');
  $('#locate').textContent = '📍 Locating…';
  watch = navigator.geolocation.watchPosition(g => {
    const first = !pos; pos = {lat: g.coords.latitude, lng: g.coords.longitude};
    $('#locate').textContent = '📍 Near me'; $('#locate').classList.add('on'); render();
    if (first && map) map.setView([pos.lat,pos.lng], 14);
  }, err => { $('#locate').textContent = '📍 Near me'; watch = null; alert('Could not get location: ' + err.message); },
  {enableHighAccuracy:true, maximumAge:15000});
};

// --- detail sheet ---
function open(id) {
  const p = DATA.places.find(x => x.id === id); if (!p) return;
  const cr = CREDITS[p.id];
  const d = pos ? `<span class="dist">${fmtD(km(pos,p))} away</span> · ` : '';
  const paras = p.script.split(/(?<=\.)\s+(?=[A-Z])/).reduce((a,s,i)=>{const k=Math.floor(i/4);(a[k]=a[k]||[]).push(s);return a},[]).map(g=>`<p>${esc(g.join(' '))}</p>`).join('');
  $('#detail').innerHTML = `
    <div class="hero"><img src="img/${p.id}.jpg" alt="${esc(p.name)}" onerror="this.style.visibility='hidden'">
      <div class="labels"><h2>${esc(p.name)}</h2><p>${p.eras.map(e=>DATA.eras[e].label).join(' · ')}</p></div>
      ${cr?`<span class="credit-ov">© ${esc(cr.author.slice(0,40))}</span>`:''}</div>
    <div class="crumb">Berlin History › ${esc(DATA.eras[p.eras[0]].label)} › ${esc(p.name)}</div>
    <div class="body">
      <div class="addr">${d}${esc(p.address)}</div>
      <div class="meta">${p.eras.map(e=>`<span><i class="dot" style="background:${DATA.eras[e].color}"></i>${DATA.eras[e].label}</span>`).join('')}</div>
      <div class="actions">
        <button class="btn primary" id="play">${PLAY} Play audioguide</button>
        <a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&travelmode=walking&destination=${p.lat},${p.lng}">Directions</a>
        <button class="btn" id="visit">${visited.has(p.id)?'✓ Visited':'Mark visited'}</button>
      </div>
      <p class="lead">${esc(p.summary)}</p>
      <div class="script">${paras}</div>
      ${cr?`<div class="credit">Photo: ${esc(cr.author)} · ${esc(cr.license||'')} · <a href="${cr.source}" target="_blank" rel="noopener">Wikimedia Commons</a></div>`:''}
    </div>`;
  $('#play').onclick = () => play(p);
  $('#visit').onclick = e => { visited.has(p.id) ? visited.delete(p.id) : visited.add(p.id); store.set('visited',[...visited]);
    e.target.textContent = visited.has(p.id)?'✓ Visited':'Mark visited'; render(); };
  $('#sheet').scrollTop = 0; $('#sheet').classList.add('open'); $('#sheet').setAttribute('aria-hidden','false');
  history.replaceState(null, '', '#' + id);
}
function closeSheet(){ $('#sheet').classList.remove('open'); $('#sheet').setAttribute('aria-hidden','true'); history.replaceState(null,'',location.pathname); }
$('#close').onclick = closeSheet;

// --- audio player (MP3 if generated, otherwise device text-to-speech) ---
const audio = $('#audio');
function play(p) {
  speechSynthesis?.cancel(); current = p; useSpeech = false;
  $('#pn').textContent = p.name; $('#player').classList.add('show');
  audio.src = `audio/${p.id}.mp3`;
  if (STORY) { renderHomeStory(); if (!$('#story').hidden) renderStory(); }
  audio.play().catch(() => {});
  audio.onerror = () => speak(p);
  if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({title:p.name, artist:'Berlin History Walks', artwork:[{src:`img/${p.img || p.id}.jpg`, sizes:'1000x750', type:'image/jpeg'}]});
}
function speak(p) {
  if (!('speechSynthesis' in window)) { $('#ps').textContent = 'Audio not generated yet'; return; }
  useSpeech = true; audio.removeAttribute('src');
  const u = new SpeechSynthesisUtterance(p.name + '. ' + (p.script || p.text));
  u.lang = 'en-GB'; u.rate = .95;
  u.onend = () => { setPP(false); };
  speechSynthesis.speak(u); setPP(true); $('#ps').textContent = 'Device voice (MP3 not generated yet)';
}
$('#pp').onclick = () => {
  if (useSpeech) { if (speechSynthesis.paused) { speechSynthesis.resume(); setPP(true); } else if (speechSynthesis.speaking) { speechSynthesis.pause(); setPP(false); } else if (current) speak(current); return; }
  audio.paused ? audio.play() : audio.pause();
};
$('#skip').onclick = () => { if (!useSpeech) audio.currentTime = Math.max(0, audio.currentTime - 15); };
audio.onplay = () => setPP(true);
audio.onended = () => { const n = current?.next; if (n != null && STORY?.chapters[n]) play(chapterItem(STORY.chapters[n], n)); else setPP(false); };
audio.onpause = () => setPP(false);
audio.ontimeupdate = () => { $('#seek').value = audio.duration ? audio.currentTime / audio.duration * 100 : 0; $('#ps').textContent = fmtT(audio.currentTime) + ' / ' + fmtT(audio.duration); };
$('#seek').oninput = e => { if (audio.duration) audio.currentTime = e.target.value / 100 * audio.duration; };

if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
const setHH = () => document.documentElement.style.setProperty('--hh', $('header').offsetHeight + 'px');
addEventListener('resize', setHH); setHH();
setPP(false);
init(); renderHomeStory();
</script>
</body>
</html>
